name: Stage 4 verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify authentication and database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      JWT_SECRET: stage4-verification-only-not-a-production-secret
      CLIENT_ORIGIN: http://localhost:5500

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check application syntax
        run: npm run check

      - name: Run Stage 4 smoke test
        run: node scripts/smoke-test.js
